name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: 1.7.3
  ECR_NAMESPACE: public.ecr.aws/forumone

jobs:
  terraform:
    name: Terraform (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - cluster
          - cluster/application
          - cluster/traefik-alb
          - sso
          - tf_mysql_aurora
          - tf_postgresql_aurora
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.module }}
        run: terraform fmt -diff -check

      - name: TFLint
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            --volume "$PWD/${{ matrix.module }}:/data" \
            --workdir /data \
            ghcr.io/terraform-linters/tflint-bundle

      - name: terraform-docs
        if: ${{ !cancelled() }}
        run: scripts/check-docs.sh "${{ matrix.module }}"

  scripts:
    name: Backup scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: shellcheck backups/*.sh

      - name: shfmt
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --volume "$PWD:/mnt" --workdir /mnt \
            mvdan/shfmt -i 2 -l -d backups

  # Test-build every image (the Terraform images run `terraform validate`
  # during the build). On main, also push them to public ECR.
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # AWS OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: tf_mysql_aurora
            image: ecs-terraform-mysql
          - context: tf_postgresql_aurora
            image: ecs-terraform-postgresql
          - context: backups
            image: ecs-backups
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build "${{ matrix.context }}" --tag "$ECR_NAMESPACE/${{ matrix.image }}:latest"

      # Public ECR authentication is only available in us-east-1.
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PUSH == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLIC_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        if: env.PUSH == 'true'
        with:
          registry-type: public

      - name: Push
        if: env.PUSH == 'true'
        run: docker push "$ECR_NAMESPACE/${{ matrix.image }}:latest"
